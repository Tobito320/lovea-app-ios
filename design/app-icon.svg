<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Zwei ineinander gehaengte Herzen wie bei der Wir-App. iOS rundet die Ecken selbst, daher vollflaechig. -->
  <defs>
    <path id="h" d="M0 175 C-45 130 -205 5 -205 -105 C-205 -190 -145 -232 -92 -232 C-46 -232 -12 -202 0 -160 C12 -202 46 -232 92 -232 C145 -232 205 -190 205 -105 C205 5 45 130 0 175 Z"/>
    <radialGradient id="bg" cx="50%" cy="44%" r="75%">
      <stop offset="0" stop-color="#4A1230"/>
      <stop offset=".45" stop-color="#1C0812"/>
      <stop offset="1" stop-color="#060406"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2DDE6"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D7D"/>
      <stop offset=".55" stop-color="#FF3B5C"/>
      <stop offset="1" stop-color="#FF9A5A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <g id="links" transform="translate(384 545) rotate(-14) scale(1.32)"><use href="#h"/></g>
    <g id="rechts" transform="translate(642 545) rotate(14) scale(1.32)"><use href="#h"/></g>
    <!-- Oben liegt das rosa Herz vorn, unten das weisse: die Luecke schneidet je das hintere Herz aus -->
    <mask id="linksHinten" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g clip-path="url(#oben)"><use href="#rechts" fill="none" stroke="#000" stroke-width="54"/></g>
    </mask>
    <mask id="rechtsHinten" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g clip-path="url(#unten)"><use href="#links" fill="none" stroke="#000" stroke-width="54"/></g>
    </mask>
    <clipPath id="oben"><rect width="1024" height="565"/></clipPath>
    <clipPath id="unten"><rect y="565" width="1024" height="459"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 505) scale(.84) translate(-512 -505)">
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <use href="#rechts" stroke="#FF3B5C" stroke-width="44" opacity=".55" filter="url(#glow)"/>
    <use href="#links" stroke="#FFD6E4" stroke-width="44" opacity=".22" filter="url(#glow)"/>
    <use href="#links" stroke="url(#pearl)" stroke-width="44" mask="url(#linksHinten)"/>
    <use href="#rechts" stroke="url(#rose)" stroke-width="44" mask="url(#rechtsHinten)"/>
  </g>
  </g>
  <!-- Funkeln oben rechts -->
  <g transform="translate(800 262) scale(.84)">
    <path d="M0 -46 C6 -10 10 -6 46 0 C10 6 6 10 0 46 C-6 10 -10 6 -46 0 C-10 -6 -6 -10 0 -46 Z" fill="#FFE3EA" filter="url(#soft)" opacity=".7"/>
    <path d="M0 -46 C6 -10 10 -6 46 0 C10 6 6 10 0 46 C-6 10 -10 6 -46 0 C-10 -6 -6 -10 0 -46 Z" fill="#FFFFFF"/>
  </g>
</svg>
