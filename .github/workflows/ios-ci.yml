name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on iPhone
        run: |
          set -euo pipefail
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$IPHONE_ID"
          xcodebuild test \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Test on iPad
        run: |
          set -euo pipefail
          IPAD_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          test -n "$IPAD_ID"
          xcodebuild test \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            CODE_SIGNING_ALLOWED=NO
