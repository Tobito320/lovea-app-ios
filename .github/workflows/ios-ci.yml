name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verbotene Muster
        run: |
          fail=0
          if grep -rln "import PencilKit" Lovea/Sources | grep -v "LegacyMigration.swift"; then
            echo "::error::import PencilKit ausserhalb von LegacyMigration.swift"; fail=1
          fi
          if grep -rln "UIGraphicsImageRenderer" Lovea/Sources | grep -v "Export"; then
            echo "::error::UIGraphicsImageRenderer ausserhalb von Tests/ und Export"; fail=1
          fi
          if grep -rln "wir-live.pages.dev" Lovea/Sources; then
            echo "::error::wir-live.pages.dev darf nicht mehr im App-Code vorkommen"; fail=1
          fi
          exit $fail
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-Tests
        run: |
          cd server && node --test

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on iPhone
        run: |
          set -euo pipefail
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$IPHONE_ID"
          xcodebuild test \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee iphone.log
          COUNT=$(grep "warning:" iphone.log | sort -u | wc -l | tr -d ' ')
          echo "### Compiler-Warnungen: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          grep "warning:" iphone.log | sort -u | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Test on iPad
        run: |
          set -euo pipefail
          IPAD_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          test -n "$IPAD_ID"
          xcodebuild test -quiet \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            CODE_SIGNING_ALLOWED=NO
