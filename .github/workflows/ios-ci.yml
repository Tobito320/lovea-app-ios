name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Tiefentest: Methoden kommagetrennt (leer = alle bei Handstart, Rauchtest im PR)'
        required: false
        default: ''

jobs:
  patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verbotene Muster
        run: |
          fail=0
          if grep -rln "import PencilKit" Lovea/Sources | grep -v "LegacyMigration.swift"; then
            echo "::error::import PencilKit ausserhalb von LegacyMigration.swift"; fail=1
          fi
          if grep -rln "UIGraphicsImageRenderer" Lovea/Sources | grep -v "Export"; then
            echo "::error::UIGraphicsImageRenderer ausserhalb von Tests/ und Export"; fail=1
          fi
          if grep -rln "wir-live.pages.dev" Lovea/Sources; then
            echo "::error::wir-live.pages.dev darf nicht mehr im App-Code vorkommen"; fail=1
          fi
          exit $fail
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-Tests
        run: |
          cd server && node --test

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on iPhone
        run: |
          set -euo pipefail
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$IPHONE_ID"
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild test \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            -skip-testing:LoveaUITests/TiefenTestUITests \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee iphone.log
          COUNT=$(grep "warning:" iphone.log | sort -u | wc -l | tr -d ' ')
          echo "### Compiler-Warnungen: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          grep "warning:" iphone.log | sort -u | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload render gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-galerie
          path: render-galerie/
          retention-days: 7
      - name: Test on iPad
        run: |
          set -euo pipefail
          IPAD_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          test -n "$IPAD_ID"
          xcodebuild test -quiet \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -skip-testing:LoveaUITests/TiefenTestUITests \
            CODE_SIGNING_ALLOWED=NO

  # Tiefentest (Lovea/UITests/TiefenTest*): klickt jeden Tab und Kernablauf durch, Screenshot pro Schritt.
  # Nur von Hand (workflow_dispatch) oder im PR des Zweigs tiefentest-ui, nie in den normalen Läufen.
  tiefentest:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'tiefentest-ui'
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Simulator vorbereiten
        run: |
          set -euo pipefail
          IPHONE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$IPHONE_ID"
          echo "IPHONE_ID=$IPHONE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IPHONE_ID" || true
          xcrun simctl bootstatus "$IPHONE_ID" -b
          xcrun simctl privacy "$IPHONE_ID" grant photos || true
          xcrun simctl addmedia "$IPHONE_ID" docs/figuren-vorlage/*.png || true
      - name: Tiefentest
        timeout-minutes: 75
        env:
          TESTS_EINGABE: ${{ inputs.tests }}
          EREIGNIS: ${{ github.event_name }}
        run: |
          set +e
          if [ -n "$TESTS_EINGABE" ]; then LISTE="$TESTS_EINGABE"
          elif [ "$EREIGNIS" = "pull_request" ]; then LISTE="testErststart,testTabHome,testTabChatSenden"
          else LISTE=""; fi
          ONLY=(-only-testing:LoveaUITests/TiefenTestUITests)
          if [ -n "$LISTE" ]; then
            ONLY=()
            IFS=',' read -ra TEILE <<< "$LISTE"
            for t in "${TEILE[@]}"; do ONLY+=("-only-testing:LoveaUITests/TiefenTestUITests/$(echo "$t" | tr -d ' ')"); done
          fi
          xcodebuild test \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -destination "platform=iOS Simulator,id=$IPHONE_ID" \
            "${ONLY[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 1200 \
            -maximum-test-execution-time-allowance 1200 \
            -resultBundlePath tiefentest.xcresult \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee tiefentest.log
          echo "XCODE_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: Screenshots und Befunde exportieren
        if: always()
        run: |
          mkdir -p tiefentest-bilder
          xcrun xcresulttool export attachments --path tiefentest.xcresult --output-path tiefentest-bilder || true
          xcrun xcresulttool get test-results summary --path tiefentest.xcresult --compact > tiefentest-bilder/summary.json || true
          xcrun xcresulttool get test-results tests --path tiefentest.xcresult --compact > tiefentest-bilder/tests.json || true
          cp tiefentest.log tiefentest-bilder/ || true
          if [ -f tiefentest-bilder/manifest.json ]; then
            mkdir -p tiefentest-bilder/benannt
            jq -r '.[] | .testIdentifier as $t | .attachments[] | [.exportedFileName, ($t | gsub("[^A-Za-z0-9]"; "_")), .suggestedHumanReadableName] | join("|")' tiefentest-bilder/manifest.json \
              | while IFS='|' read -r datei test name; do
                  cp "tiefentest-bilder/$datei" "tiefentest-bilder/benannt/${test}__${name}" || true
                done
          fi
          {
            echo "### Tiefentest"
            echo "Exit-Status xcodebuild: ${XCODE_STATUS:-unbekannt}"
            echo "Bilder: $(find tiefentest-bilder -name '*.jpg' | wc -l | tr -d ' ') jpg, $(find tiefentest-bilder -type f | wc -l | tr -d ' ') Dateien"
            grep -E "error:|failed" tiefentest.log | sort -u | head -80 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiefentest-screenshots
          path: tiefentest-bilder/
          retention-days: 14
      - name: Ergebnis prüfen
        if: always()
        run: test "${XCODE_STATUS:-1}" = "0"
