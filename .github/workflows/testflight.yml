name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      LOVEA_APP_KEY: ${{ secrets.LOVEA_APP_KEY }}
    steps:
      - name: Secrets prüfen
        run: |
          missing=""
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPSTORE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets fehlen:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Zertifikat und Profil installieren
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lovea.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          # ponytail: Xcode 16+ reads UserData, older Xcode reads MobileDevice
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archivieren
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Lovea.xcodeproj \
            -scheme Lovea \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lovea.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            LOVEA_APP_KEY="${{ secrets.LOVEA_APP_KEY }}" \
            LOVEA_SERVER="https://lovea-live.ahmedhdplay12345.workers.dev"

      - name: IPA exportieren
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.onlyus.lovea</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lovea.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Zu TestFlight hochladen
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Lovea.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keychain löschen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/lovea.keychain-db" || true
