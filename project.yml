name: Lovea
options:
  bundleIdPrefix: com.onlyus
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    LOVEA_APP_KEY: ""
    LOVEA_SERVER: "https://lovea-live.ahmedhdplay12345.workers.dev"
    SPOTIFY_CLIENT_ID: ""
targets:
  Lovea:
    type: application
    platform: iOS
    sources:
      - Lovea/Sources
      - path: LoveaWidgets/Shared
        group: LoveaWidgetsShared
    dependencies:
      - target: LoveaWidgets
        embed: true
        codeSignOnCopy: true
    info:
      path: Lovea/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LoveaAppKey: $(LOVEA_APP_KEY)
        LoveaServer: $(LOVEA_SERVER)
        LoveaSpotifyClientID: $(SPOTIFY_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.onlyus.lovea
            CFBundleURLSchemes:
              - lovea
        UIBackgroundModes:
          - location
          - remote-notification
          - audio
        NSCameraUsageDescription: "Lovea nutzt die Kamera, damit du Fotos und Videos für den Chat und die Snaps aufnehmen kannst."
        NSMicrophoneUsageDescription: "Lovea nutzt das Mikrofon für Sprachnachrichten und Videos im Chat."
        NSPhotoLibraryUsageDescription: "Lovea liest Fotos, damit du sie im Chat oder als Zeichen-Vorlage nutzen kannst."
        NSPhotoLibraryAddUsageDescription: "Lovea speichert deine fertigen Bilder in Fotos."
        NSLocationWhenInUseUsageDescription: "Lovea zeigt deinem Partner deinen Standort auf der Karte, solange du die App offen hast."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Lovea zeigt deinem Partner deinen Standort auch im Hintergrund und meldet Ankunft und Abfahrt an euren Orten."
        NSMotionUsageDescription: "Lovea erkennt Bewegung wie Laufen oder Fahren, damit eure Figuren euren Alltag zeigen."
        NSSpeechRecognitionUsageDescription: "Lovea wandelt deine Sprachnachrichten in Text um, wenn du das im Chat anforderst."
        NSFocusStatusUsageDescription: "Lovea zeigt deinem Partner, ob du gerade nicht gestört werden möchtest."
        NSCalendarsFullAccessUsageDescription: "Lovea liest deinen Kalender, um Termine mit deinem Partner abzugleichen."
        NSCalendarsWriteOnlyAccessUsageDescription: "Lovea trägt gemeinsame Termine in deinen Kalender ein."
        NSHealthShareUsageDescription: "Lovea zeigt euch gegenseitig eure Schritte, Strecke, Etagen und euren Schlaf."
        NSHealthUpdateUsageDescription: "Lovea schreibt nichts in Health. Apple verlangt diesen Text trotzdem."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea
        PRODUCT_NAME: Lovea
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lovea
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: Lovea/Lovea.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: $(LOVEA_APP_PROFILE)
  LoveaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LoveaWidgets/Sources
      - path: LoveaWidgets/Shared
        group: LoveaWidgetsShared
    info:
      path: LoveaWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LoveaAppKey: $(LOVEA_APP_KEY)
        LoveaServer: $(LOVEA_SERVER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea.widgets
        PRODUCT_NAME: LoveaWidgets
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lovea Widgets
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: LoveaWidgets/LoveaWidgets.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: $(LOVEA_WIDGETS_PROFILE)
  LoveaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Lovea/Tests
    dependencies:
      - target: Lovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea.tests
  LoveaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Lovea/UITests
    dependencies:
      - target: Lovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea.uitests
        TEST_TARGET_NAME: Lovea
schemes:
  Lovea:
    build:
      targets:
        Lovea: all
        LoveaWidgets: all
        LoveaTests: [test]
        LoveaUITests: [test]
    test:
      targets:
        - LoveaTests
        - LoveaUITests
