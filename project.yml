name: Lovea
options:
  bundleIdPrefix: com.onlyus
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  Lovea:
    type: application
    platform: iOS
    sources:
      - Lovea/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea
        PRODUCT_NAME: Lovea
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lovea
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Lovea speichert deine fertigen Bilder in Fotos."
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  LoveaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Lovea/Tests
    dependencies:
      - target: Lovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea.tests
  LoveaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Lovea/UITests
    dependencies:
      - target: Lovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lovea.uitests
        TEST_TARGET_NAME: Lovea
schemes:
  Lovea:
    build:
      targets:
        Lovea: all
        LoveaTests: [test]
        LoveaUITests: [test]
    test:
      targets:
        - LoveaTests
        - LoveaUITests
